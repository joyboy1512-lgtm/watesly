name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mywat
          POSTGRES_PASSWORD: mywat
          POSTGRES_DB: mywat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mywat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://mywat:mywat@localhost:5432/mywat
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          APP_SECRET_KEY: ci-secret-key-for-tests-only-32chars-min
          CREDENTIAL_ENCRYPTION_KEY: 4XH2gZKuwoDy5UB0NtZJ6vGKnMl0oEvh9jlqHFq1rHs=
          DATA_KEY_ENCRYPTION_KEY: 71A3ZiF_LAY7vTIR5ksA9nxqbdOUoP2QmfP4zls9nKA=
          META_APP_SECRET: ci-meta-app-secret
          META_WEBHOOK_VERIFY_TOKEN: ci-webhook-verify-token
          META_GRAPH_API_VERSION: v23.0
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: mywat
          S3_PUBLIC_BASE_URL: http://localhost:9000/mywat
      - run: pytest tests/ -q
        env:
          DATABASE_URL: postgresql+asyncpg://mywat:mywat@localhost:5432/mywat
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          APP_SECRET_KEY: ci-secret-key-for-tests-only-32chars-min
          CREDENTIAL_ENCRYPTION_KEY: 4XH2gZKuwoDy5UB0NtZJ6vGKnMl0oEvh9jlqHFq1rHs=
          DATA_KEY_ENCRYPTION_KEY: 71A3ZiF_LAY7vTIR5ksA9nxqbdOUoP2QmfP4zls9nKA=
          META_APP_SECRET: ci-meta-app-secret
          META_WEBHOOK_VERIFY_TOKEN: ci-webhook-verify-token
          META_GRAPH_API_VERSION: v23.0
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: mywat
          S3_PUBLIC_BASE_URL: http://localhost:9000/mywat

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
