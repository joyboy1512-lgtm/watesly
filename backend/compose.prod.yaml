services:
  migrate:
    build: {context: .}
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: .}
    env_file: [.env]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports: ["127.0.0.1:8000:8000"]
    deploy: {resources: {limits: {cpus: "2.0", memory: 2G}, reservations: {memory: 512M}}}
    logging: {driver: "json-file", options: {max-size: "10m", max-file: "5"}}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    build: {context: .}
    env_file: [.env]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--max-tasks-per-child=1000", "-Q", "webhooks,campaigns,automations,default"]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    build: {context: .}
    env_file: [.env]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/api/v1}
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_healthy}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["watesly_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes: ["watesly_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["watesly_minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  watesly_postgres_data:
  watesly_minio_data:
  watesly_redis_data:
