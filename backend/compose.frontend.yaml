services:
  frontend:
    image: node:24-alpine
    container_name: watesly_frontend
    working_dir: /app
    env_file:
      - ../frontend/.env
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - watesly_frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  watesly_frontend_node_modules:
