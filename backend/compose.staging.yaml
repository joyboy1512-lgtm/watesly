services:
  api:
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      REFRESH_COOKIE_SECURE: "true"
  worker:
    restart: unless-stopped
  beat:
    restart: unless-stopped
