services:
  migrate:
    build: {context: .}
    container_name: watesly_migrate
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    volumes: [".:/app"]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: {context: .}
    container_name: watesly_api
    env_file: [.env]
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    restart: unless-stopped
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: {context: .}
    container_name: watesly_worker
    env_file: [.env]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "webhooks,campaigns,automations,default"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes: [".:/app"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  beat:
    build: {context: .}
    container_name: watesly_beat
    env_file: [.env]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid"]
    restart: unless-stopped
    volumes: [".:/app"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  db:
    image: postgres:17-alpine
    container_name: watesly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["watesly_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: watesly_redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["watesly_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: watesly_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["watesly_minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  watesly_postgres_data:
  watesly_minio_data:
  watesly_redis_data:
